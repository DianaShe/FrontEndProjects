<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="main">
      <section class="section">
        <div class="side">
          <h2 class="title_2">Create an Account</h2>
          <form class="form">
            <div class="row">
              <div class="col col_half">
                <label for="first-name" class="label">First Name</label>
                <input type="text" id="first-name" />
              </div>
              <div class="col col_half">
                <label for="last-name" class="label">Last Name</label>
                <input type="text" id="last-name" />
              </div>
            </div>
            <div class="row">
              <div class="col col_full">
                <label for="mail" class="label">E-mail</label>
                <input type="email" id="mail" />
                <p class="text">
                  We'll never share your email with anyone else.
                </p>
              </div>
            </div>

            <div class="gender">
              <div class="gender_item">
                <label>
                  <input type="radio" name="gender" />
                  <span class="gender_check"></span>
                  Male
                </label>
                <label>
                  <input type="radio" name="gender" />
                  <span class="gender_check"></span>
                  Female
                </label>
              </div>
            </div>

            <div class="row">
              <div class="col col_half select">
                <label for="country" class="label"> Country</label>
                <div class="select_cont">
                  <select name="country" id="country">
                    <option value="Ukraine">Ukraine</option>
                    <option value="Poland">Poland</option>
                    <option value="Germany">Germany</option>
                  </select>
                </div>
              </div>
              <div class="col col_half">
                <label for="city" class="label">City</label>
                <input type="text" id="city" />
              </div>
            </div>

            <div class="row">
              <button class="btn btn_full">Sign Up</button>
            </div>
          </form>
          <div class="text_cont">
            <p class="text">
              By clicking the 'Sign Up' button, you confirm that you accept our
              <a href="#" class="link">Terms of Use</a> and
              <a href="#" class="link">Privacy Policy</a>.
            </p>
          </div>
          <div class="row bottom_row">
            <p>Have an account?</p>
            <a href="#" class="link">Log in</a>
          </div>
        </div>
        <div class="side">
          <h2 class="title_2">Profile</h2>
          <form class="form">
            <div class="row row_start">
              <div class="img_cont">
                <img src="./img/Image.jpg" alt="Profile" />
              </div>
              <div class="input_cont">
                <input id="photo" type="file" />
                <label for="photo" class="text">Up to 1 MB (300x300 px)</label>
              </div>
              <button class="btn btn_icon">
                <img src="./img/icon_trash.png" alt="Delete" />
              </button>
            </div>
            <div class="row">
              <div class="col col_half">
                <label for="name" class="label">Name</label>
                <input type="text" id="name" />
              </div>
              <div class="col col_half">
                <label for="email" class="label">E-mail</label>
                <input type="email" id="email" />
              </div>
            </div>
            <div class="row">
              <div class="col col_half select">
                <label for="country" class="label"> Country</label>
                <div class="select_cont">
                  <select name="country" id="country">
                    <option value="Ukraine">Ukraine</option>
                    <option value="Poland">Poland</option>
                    <option value="Germany">Germany</option>
                  </select>
                </div>
              </div>
              <div class="col col_half">
                <label for="city" class="label">City</label>
                <input type="text" id="city" />
              </div>
            </div>
            <div class="row">
              <div class="col col_half">
                <label for="zip_code" class="label">Zip Code</label>
                <input type="text" id="zip_code" />
              </div>
              <div class="col col_half">
                <label for="phone_number" class="label">Phone number</label>
                <input type="text" id="phone_number" />
              </div>
            </div>

            <div class="row">
              <button class="btn btn_min">Sign Up</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
