<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="header_title">CSS Dinner Shopping List</h1>
        <p class="header_text">Let’s go to the mall!</p>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <form class="shopping_list">
          <label class="list_item">
            <input type="checkbox" name="" />
            <span></span>
            <p class="list_item_name">A lot of pickles</p>
            <p class="list_item_text">for the next lessons about CSS</p>
          </label>
          <label class="list_item">
            <input type="checkbox" name="" />
            <span></span>
            <p class="list_item_name">10 apples</p>
            <p class="list_item_text">for more CSS manipulations</p>
          </label>
          <label class="list_item"
            ><input type="checkbox" name="" /> <span></span>
            <p class="list_item_name">20 oranges</p>
            <p class="list_item_text">because they are awesome</p>
          </label>
          <label class="list_item"
            ><input type="checkbox" name="" /> <span></span>
            <p class="list_item_name">13 plates</p>
            <p class="list_item_text">hm... they always dissapear</p>
          </label>
          <label class="list_item"
            ><input type="checkbox" name="" /> <span></span>
            <p class="list_item_name">15 bentos</p>
          </label>
          <label class="list_item"
            ><input type="checkbox" name="" /> <span></span>
            <p class="list_item_name">1 bottle of Sake</p>
            <p class="list_item_text">for my friends</p>
          </label>
        </form>
        <button type="button" class="bottom_button">Bon appetit :)</button>
      </div>
    </main>
  </body>
</html>
